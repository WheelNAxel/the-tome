        <div className="topbar-actions">
          <span style={{fontFamily:'Cinzel,serif',fontSize:'.8rem',color:'var(--gold-dark)'}}>{player.name}</span>
          <RulesBtn/>
          <button className="btn btn-ghost btn-sm" onClick={onLogout}>Leave Campaign</button>
        </div>
      </div>
      <div className="campaign-view" style={{flex:1,overflow:'hidden'}}>
        <div className="campaign-header"><h2>{campaign.name}</h2><span className="code-badge">{campaign.sessionCode}</span></div>
        <div className="tab-bar">
          <button className={`tab-btn${tab==='world'?' active':''}`} onClick={()=>setTab('world')}>📜 World Lore</button>
          <button className={`tab-btn${tab==='character'?' active':''}`} onClick={()=>setTab('character')}>🧝 Character Sheet</button>
        </div>
        <div className="tab-content" style={{overflow:'auto'}}>
          {tab==='world'&&(
            <div className="player-layout">
              <div className="player-sidebar">
                <div style={{fontFamily:'Cinzel,serif',fontSize:'.72rem',letterSpacing:'.1em',color:'var(--gold-dark)',marginBottom:'.75rem',textTransform:'uppercase'}}>Revealed Documents</div>
                {!revealed.length&&<div style={{fontSize:'.82rem',color:'rgba(244,232,193,.4)',fontStyle:'italic',fontFamily:'IM Fell English,serif'}}>The DM hasn't revealed any lore yet…</div>}
                {CATEGORIES.map(cat=>{
                  const docs=grouped[cat];if(!docs.length)return null
                  return <div key={cat} className="doc-category-section">
                    <div className="doc-category-title">{cat}</div>
                    {docs.map(doc=>(
                      <div key={doc.id} className="doc-preview-card" onClick={()=>doc.category==='Map'&&doc.image?setViewMap(doc):setViewDoc(doc)}>
                        <h4>{doc.title}</h4>
                        <div className="preview-text">{doc.body?.replace(/<[^>]+>/g,' ').substring(0,80)||'—'}</div>
                      </div>
                    ))}
                  </div>
                })}
              </div>
              <div className="player-main">
                {!revealed.length?(
                  <div className="empty-art" style={{marginTop:'3rem',flex:1}}>
                    <svg width="120" height="140" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <ellipse cx="60" cy="76" rx="36" ry="46" fill="none" stroke="#C9A84C" strokeWidth="1.2" opacity=".25"/>
                      <ellipse cx="60" cy="76" rx="28" ry="38" fill="none" stroke="#C9A84C" strokeWidth=".7" opacity=".18"/>
                      <path d="M60 30 C60 30 44 52 44 68 C44 77 51 84 60 84 C69 84 76 77 76 68 C76 52 60 30 60 30Z" fill="rgba(201,168,76,.06)" stroke="#C9A84C" strokeWidth="1" opacity=".3"/>
                      <path d="M60 30 L60 84" stroke="#C9A84C" strokeWidth=".6" strokeDasharray="3 3" opacity=".2"/>
                      <circle cx="60" cy="30" r="2.5" fill="#C9A84C" opacity=".4"/>
                      <path d="M36 104 Q60 96 84 104" stroke="#C9A84C" strokeWidth=".8" opacity=".2" fill="none"/>
                      <path d="M40 110 Q60 104 80 110" stroke="#C9A84C" strokeWidth=".6" opacity=".15" fill="none"/>
                      <path d="M28 76 L36 76" stroke="#C9A84C" strokeWidth=".8" opacity=".2"/>
                      <path d="M84 76 L92 76" stroke="#C9A84C" strokeWidth=".8" opacity=".2"/>
                      <circle cx="60" cy="16" r="1.5" fill="#C9A84C" opacity=".3"/>
                      <line x1="54" y1="16" x2="46" y2="20" stroke="#C9A84C" strokeWidth=".6" opacity=".2"/>
                      <line x1="66" y1="16" x2="74" y2="20" stroke="#C9A84C" strokeWidth=".6" opacity=".2"/>
                    </svg>
                    <div className="empty-title">The Pages Lie Sealed</div>
                    <div className="empty-sub">The secrets of this world remain hidden. Your Dungeon Master will illuminate the tome as your adventure unfolds.</div>
                    <div className="filigree" style={{opacity:.3}}>✦ ✦ ✦</div>
                  </div>
                ):(
                  CATEGORIES.map(cat=>{
                    const docs=grouped[cat];if(!docs.length)return null
                    return <div key={cat} style={{marginBottom:'2rem'}}>
                      <div className="ornament"><span style={{fontFamily:'Cinzel,serif',fontSize:'.75rem',letterSpacing:'.12em',color:'var(--gold-dark)',textTransform:'uppercase'}}>{cat}</span></div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:'.75rem'}}>
                        {docs.map(doc=>(
                          <div key={doc.id} className="doc-preview-card" onClick={()=>doc.category==='Map'&&doc.image?setViewMap(doc):setViewDoc(doc)} style={{padding:'1rem'}}>
                            {doc.image&&<img src={doc.image} alt="" style={{width:'100%',height:100,objectFit:'cover',borderRadius:3,marginBottom:'.5rem',border:'1px solid rgba(201,168,76,.2)'}}/>}
                            <h4>{doc.title}</h4>
                            {doc.category==='Map'?<div className="preview-text">🗺 Click to explore the map</div>:<div className="preview-text">{doc.body?.replace(/<[^>]+>/g,' ').substring(0,100)||'—'}</div>}
                          </div>
                        ))}
                      </div>
                    </div>
                  })
                )}
              </div>
            </div>
          )}
          {tab==='character'&&(
            <CharacterTabWrapper campaignId={player.campaignId} playerName={player.name} displayName={player.name}/>
          )}
        </div>
      </div>
      {viewDoc&&<DocumentViewer doc={viewDoc} onClose={()=>setViewDoc(null)}/>}
      {viewMap&&<MapViewer doc={viewMap} onClose={()=>setViewMap(null)}/>}
    </div>
  )
}

// ── Root App ─────────────────────────────────────────────────────────────────
function App() {
  const [view,setView]=useState('landing')
  const [dm,setDm]=useState(null),[player,setPlayer]=useState(null)
  const [campaignId,setCampaignId]=useState(null)
  const [joinCode,setJoinCode]=useState('')

  useEffect(()=>{
    const params=new URLSearchParams(window.location.search)
    // ?code=123456 — direct join link
    const codeParam=params.get('code')
    if(codeParam){
      window.history.replaceState({},'',window.location.pathname)
      setJoinCode(codeParam.replace(/\D/g,'').slice(0,6))
      setView('join'); return
    }
    // Legacy ?join= base64 link support
    const joinData=params.get('join')
    if(joinData){
      const imported=importCampaignFromLink(joinData)
      window.history.replaceState({},'',window.location.pathname)
      if(imported) setJoinCode(imported.sessionCode)
      setView('join'); return
    }

    const isLocal = ['localhost','127.0.0.1'].includes(location.hostname)
    const d=Storage.currentDM(), p=Storage.currentPlayer()

    if(p){setPlayer(p);setView('player-view');return}
    // Cloud: DM can be on any device. Local server: only localhost is DM.
    if(d && (IS_CLOUD || isLocal)){setDm(d);setView('dm-dashboard');return}

    // Local server non-localhost → player device, go straight to join
    if(IS_SERVER && !isLocal){setView('join');return}
  },[])

  function loginDM(d){setDm(d);setView('dm-dashboard')}
  function joinPlayer(p){setPlayer(p);setView('player-view')}
  function openCampaign(id){setCampaignId(id);setView('dm-campaign')}
  function logoutDM(){Storage.logoutDM();setDm(null);setCampaignId(null);setView('landing')}
  function logoutPlayer(){Storage.logoutPlayer();setPlayer(null);setView('landing')}

  if(view==='landing')return<Landing onDM={()=>setView('dm-login')} onPlayer={()=>setView('join')}/>
  if(view==='dm-login')return<LoginScreen onLogin={loginDM} onBack={()=>setView('landing')}/>
  // 'join' view: back button returns DM to dashboard if they were logged in, else landing
  if(view==='join')return<PlayerJoin onJoin={joinPlayer} onBack={()=>dm?setView('dm-dashboard'):setView('landing')} prefillCode={joinCode}/>
  if(view==='dm-dashboard')return<DMDashboard dm={dm} onOpen={openCampaign} onLogout={logoutDM} onPlayerJoin={()=>setView('join')}/>
  if(view==='dm-campaign')return<CampaignView dm={dm} campaignId={campaignId} onBack={()=>setView('dm-dashboard')} onLogout={logoutDM} onPlayerJoin={()=>setView('join')}/>
  if(view==='player-view')return<PlayerView player={player} onLogout={logoutPlayer}/>
  return null
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
<script>
// ── Dev stress-test (runs automatically, results in console) ────────────────
(function runStressTest() {
  const CAMPAIGN_CODE = '__TEST__'
  const results = []
  let pass = 0, fail = 0

  function assert(label, condition) {
    if (condition) { pass++; results.push('✅ ' + label) }
    else           { fail++; results.push('❌ FAIL: ' + label) }
  }

  try {
    // ── 1. Setup: create a test campaign directly in localStorage ───────────
    const testCampaign = {
      id: '__test_campaign__',
      dmEmail: 'test@dm.com',
      name: 'Stress Test Campaign',
      sessionCode: CAMPAIGN_CODE,
      createdAt: Date.now(),
      documents: [],
      players: {}
    }
    const cs = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
    cs[testCampaign.id] = testCampaign
    localStorage.setItem('tome_campaigns', JSON.stringify(cs))

    // ── 2. Verify code lookup works ─────────────────────────────────────────
    const found = Object.values(JSON.parse(localStorage.getItem('tome_campaigns')))
      .find(c => c.sessionCode === String(CAMPAIGN_CODE).trim())
    assert('Campaign found by code', !!found)
    assert('Campaign code matches exactly', found?.sessionCode === CAMPAIGN_CODE)

    // ── 3. Simulate 12 players joining sequentially ─────────────────────────
    const PLAYER_NAMES = [
      'Arya Swiftblade','Brom Ironforge','Celia Moonwhisper','Daelan Ashveil',
      'Elowen Brightstar','Fyra Stonehammer','Gideon Ravenscar','Hela Thornwood',
      'Idris Flamecaller','Joryn Deepwater','Kira Shadowstep','Lorien Goldleaf'
    ]

    for (const name of PLAYER_NAMES) {
      const campaigns = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
      const campaign = Object.values(campaigns).find(c => c.sessionCode === CAMPAIGN_CODE)
      if (!campaign) { assert(`${name} join — campaign found`, false); continue }
      if (!campaign.players[name]) {
        campaign.players[name] = { characterSheet: { characterName: name } }
      }
      campaigns[campaign.id] = campaign
      localStorage.setItem('tome_campaigns', JSON.stringify(campaigns))
      assert(`${name} joined`, true)
    }

    // ── 4. Verify all 12 are stored ─────────────────────────────────────────
    const afterJoin = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
    const testC = afterJoin['__test_campaign__']
    const playerCount = Object.keys(testC?.players || {}).length
    assert('All 12 players stored', playerCount === 12)
    assert('Player count does not exceed 12', playerCount <= 12)

    // ── 5. Verify each player's name is correct ─────────────────────────────
    for (const name of PLAYER_NAMES) {
      assert(`${name} found in roster`, !!testC?.players[name])
    }

    // ── 6. Verify duplicate join is idempotent (same player joins twice) ────
    const dupCampaigns = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
    const dupC = dupCampaigns['__test_campaign__']
    if (!dupC.players['Arya Swiftblade']) dupC.players['Arya Swiftblade'] = {}
    dupCampaigns[dupC.id] = dupC
    localStorage.setItem('tome_campaigns', JSON.stringify(dupCampaigns))
    const afterDup = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
    assert('Duplicate join is idempotent (still 12 players)', Object.keys(afterDup['__test_campaign__'].players).length === 12)

    // ── 7. Verify 13th player can still join (no hard cap) ──────────────────
    const extra = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
    const extraC = extra['__test_campaign__']
    extraC.players['Mira Dawnseeker'] = { characterSheet: {} }
    extra[extraC.id] = extraC
    localStorage.setItem('tome_campaigns', JSON.stringify(extra))
    const after13 = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
    assert('13th player can join (no hard cap)', Object.keys(after13['__test_campaign__'].players).length === 13)

    // ── 8. Verify encodeCampaignLink strips images ──────────────────────────
    const withImages = { ...testCampaign, documents: [{ id:'d1', title:'Map', image: 'data:image/png;base64,' + 'A'.repeat(1000), revealed: true }] }
    try {
      const slim = { ...withImages, documents: withImages.documents.map(d=>({...d,image:null})), players:{} }
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify({campaign:slim}))))
      assert('encodeCampaignLink strips images (URL stays short)', encoded.length < 2000)
    } catch(e) { assert('encodeCampaignLink strips images', false) }

    // ── 9. Verify importCampaignFromLink round-trips ────────────────────────
    try {
      const slim = { ...testCampaign, documents: [], players: {} }
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify({campaign:slim}))))
      const decoded = JSON.parse(decodeURIComponent(escape(atob(encoded))))
      assert('Campaign round-trips through encode/decode', decoded.campaign?.sessionCode === CAMPAIGN_CODE)
    } catch(e) { assert('Campaign round-trips through encode/decode', false) }

  } catch(err) {
    results.push('💥 Uncaught error: ' + err.message)
    fail++
  } finally {
    // Cleanup: remove test campaign
    try {
      const cs = JSON.parse(localStorage.getItem('tome_campaigns') || '{}')
      delete cs['__test_campaign__']
      localStorage.setItem('tome_campaigns', JSON.stringify(cs))
    } catch {}
  }

  const summary = `\n${'─'.repeat(50)}\nThe Tome — Stress Test Results\n${'─'.repeat(50)}\n${results.join('\n')}\n${'─'.repeat(50)}\n${pass} passed · ${fail} failed\n${'─'.repeat(50)}`
  if (fail === 0) console.log('%c' + summary, 'color:#C9A84C;font-family:monospace')
  else            console.error(summary)
  window.__tomeTestResults = { pass, fail, results }
})()

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{})
  })
}
</script>
